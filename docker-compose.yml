services:
  mongo_db:
    image: mongo:latest
    container_name: library_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: books
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis_cache:
    image: redis:latest
    container_name: library_redis
    ports:
      - "6379:6379"
  api:
    build: .
    container_name: library_api
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongo_admin:password@mongo_db:27017
      - REDIS_URL=redis://redis_cache:6379
      - MOCK_URL=http://mock_api:4010
    depends_on:
      - mongo_db
    volumes:
      - .:/app

  master:
    image: locustio/locust
    depends_on:
      - api
    ports:
      - "8089:8089"
    volumes:
      - ./:/mnt/locust
    command: -f /mnt/locust/locust_tests/locustfile.py --master -H http://api:8000

  worker:
    image: locustio/locust
    depends_on:
      - master
    volumes:
      - ./:/mnt/locust
    command: -f /mnt/locust/locust_tests/locustfile.py --worker --master-host master


volumes:
  mongo_data: