services:
  db:
    image: postgres:17-alpine
    container_name: library_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: library
    ports:
      - "4422:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: library_api
    ports:
      - "8008:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@db:5432/library
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data: